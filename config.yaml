paths:
  raw_data: data/分产品1min主连/RBZL.SHF.csv
  product_data_dir: data/分产品1min主连
  product_registry: data/product_registry.json
  factor_dir: data/factors
  mid_weekly_dir: data/mid_weekly/_cleaned
  product_cache_dir: results/cache/products
  merged_cache: results/cache/merged_features.parquet
  cache_meta: results/cache/merged_features_meta.json
  model_dir: results/models
  training_summary: results/models/training_summary.json
  backtest_dir: results/backtest
  run_root: results/runs
  report_dir: results/reports
  regime_plot: results/reports/vol_regime_split.png
  training_plot: results/reports/training_diagnostics.png
  training_comparison_plot: results/reports/regime_model_comparison.png
  backtest_plot: results/reports/backtest_report.png
  prediction_cache: results/backtest/test_predictions.parquet

data:
  timestamp_col: TDATE
  trade_date_col: TRADE_DATE
  train_ratio: 0.70
  valid_ratio: 0.15
  test_ratio: 0.15
  target_horizon: 30         # 1min × horizon 持仓窗口
  factor_pattern: "*.csv"
  factor_include: []
  factor_exclude: []
  max_factor_missing_ratio: 0.35
  min_factor_std: 1.0e-8
  fill_method: forward_fill
  cache_merged_dataset: false   # 全局关闭 merged feature parquet 缓存（读+写）
  force_rebuild_cache: false
  use_engineered_features: true
  use_synthetic_factors: true
  use_mid_weekly: true         # Optuna v2：打开中观，复用 v1 最优微观参数
  mid_alignment: asof_forward_fill
  engineered_windows:
    short: 5
    medium: 20
    long: 60

vol_split:
  window: 20
  vol_percentage: 0.75 # AL h30 sweep: sharpe 0.887@0.75 vs −1.518@0.65; 多品种平均亦以0.75稳健
  label_train_only: false
  regime_label_source: daily
  split_granularity: month
  min_train_rows_per_regime: 20000
  rolling_regime_window: 240  # 240 天滚动 vol_percentage 分位数做 regime 阈值（baseline_roll240 实验证实优于固定 cutoff，22 共同品种 +5.49pp）

factors:
  runtime:
    enabled: true
    windows: [5, 10, 20, 30, 60]
    lags: [0, 1, 2, 3, 4]
    groups:
      - price_lags
      - kline
      - trend
      - volatility
      - direction
      - volume
      - correlation
    cache_generated_features: false   # 全局关闭 runtime 因子缓存
  audit_thresholds:
    # Tier A：微观因子（ENG_*、runtime）。1分钟月度窗口，~2400 obs/窗口。
    min_abs_ic: 0.005
    min_icir: 0.3
    min_obs_per_window: 200

  mid_audit:
    # Tier B/C：中观因子按原生频率计算 IC，与微观独立审计。
    # 周频因子每月只有 4-5 个独立观测；1分钟粒度下相邻月 IC 约 75% 重叠，
    # std_ic 被低估 2-3×，ICIR 虚高。原生频率下样本独立，估计诚实。
    daily:                         # Tier B：日频中观。日度月度窗口，~22 obs/窗口。
      min_abs_ic: 0.015
      min_icir: 0.40
      min_obs_per_window: 15
    weekly:                        # Tier C：周/月频中观。周度季度窗口，~13 obs/窗口。
      min_abs_ic: 0.030
      min_icir: 0.40
      max_icir: 0.90               # 上限：季度窗口 ~14 窗口下 |ICIR|>0.9 通常是制度特定过拟合
                                   # （如 PB 铅价单边行情 2021-2023 → 2024 反转失效）
      min_obs_per_window: 8
      max_raw_features: 6          # 每品种通过的原始指标上限（按 |ICIR| 取 top-N）
    val_consistency:
      # val 全段 IC（不做 walk-forward）作为第二门，防 factor decay。
      # 要求 sign(IC_val)==sign(IC_train) 且 |IC_val| >= retention × |IC_train|。
      required: true
      daily_min_retention: 0.40
      weekly_min_retention: 0.35
    midxmicro_max_per_product: 15  # MIDxMICRO 不做独立 IC 审计；靠父因子门 + 硬上限
    max_mid_total_per_product: 8   # Tier C + MIDxMICRO 合计上限（按 |ICIR| 取 top-N）
                                   # 防止：①多个高 ICIR 同向特征过度主导模型 → pred_std 塌陷
                                   #       ②大量派生特征膨胀 pred_std → 交易次数爆炸

mid_weekly:
  available_dummy: true            # emit MID_*_AVAILABLE int8 per level column
  ffill_max_bars: 8064             # cap ffill staleness (~5.6 天 @ 1min bar = 8064 / 1440)
  derived:
    enabled: true
    rolling_windows: [4, 13, 52]   # weeks
    # transforms 选项：ret / zscore / pct_rank / accel / extreme_flag
    # accel = 二阶差分（变化的变化），extreme_flag = HIGH/LOW dummy（基于 pct_rank 阈值）
    transforms: [ret, zscore, pct_rank, accel, extreme_flag]
  extreme_high_quantile: 0.85      # extreme_flag: pct_rank > 0.85 → HIGH_FLAG=1
  extreme_low_quantile: 0.15       # extreme_flag: pct_rank < 0.15 → LOW_FLAG=1
  # mid × micro 显式交互：把 mid 状态变量与微观核心因子做笛卡尔乘积，
  # 命名 MIDxMICRO_<micro>_X_<mid>（"中观乘以微观"，前缀直观体现交互含义）。
  # 让模型显式见到"基本面状态修饰微观信号"。详见 cal_factors.add_mid_micro_interactions。
  micro_interactions:
    enabled: true
    max_columns: 100
    mid_selector: pct_rank_only    # pct_rank_only / pct_rank_and_extreme / all
    micro_factors:
      - ENG_PREV_CLOSE_LOG_RET
      - ENG_INTRADAY_LOG_RET_CUMSUM
      - ENG_INTRADAY_RV_60
      - ENG_DAY_RANGE_POS
      - ENG_RET_60
  level_keep: false                # G1: drop raw MID_* level columns; keep derived + AVAILABLE only
  missing_ratio_relax: 0.65        # applied only to MID_* cols, replaces default 0.35
  # § 15 P2 option A — frequency-aware quality filter applied before derivation/merge.
  # Per xlsx column: eff_ratio = non_null_ratio / expected_ratio(frequency).
  # eff_ratio < min_active_ratio  → drop column (and its AVAILABLE / derived).
  # If drop_step_dummy is true, also drop columns whose first valid observation is
  # not at the earliest row AND post-first non-null rate ≥ 0.9 (step-dummy pattern).
  min_active_ratio: 0.6
  drop_step_dummy: true
  freq_expected_ratio:             # expected non-null ratio on xlsx business-day grid
    "日": 1.0
    "周": 0.2
  # 发布滞后（天）：把 mid_weekly 观测的时间戳 +N day，作为防前视处理。
  # publication_lag_days 是 fallback；publication_lag_days_per_freq 按列的 freq
  # 字符串映射，优先级更高（同一 xlsx 内不同 freq 列会被分别 lag 到不同 ts）。
  # 现行设置：日=1（次日才确定），周=3（典型 1-3 个工作日发布滞后）。
  publication_lag_days: 1
  publication_lag_days_per_freq:
    "日": 1
    "周": 3
    "月": 5

batch_training:
  enforce_registry_coverage: true
  required_data_start: 2021-01-01
  required_data_end: 2025-01-01
  max_zero_volume_ratio: 0.5

model:
  target_column: target_vol_norm
  scale_method: robust
  target_vol_window: 20
  target_vol_epsilon: 1.0e-8
  target_vol_floor_quantile: 0.05
  num_boost_round: 600
  early_stopping_rounds: 50
  feature_importance_top_n: 20
  persist_models: true
  min_regime_val_ic: -0.01  # regime quality gate: val spearman IC below this → position=0 for that regime
  sample_weight_alpha: 0    # 策略A: 0=均匀权重(当前), 1=线性, 2=平方; A/B对比先跑alpha=1
  # build_model_settings 根据 data.use_mid_weekly 自动切换：
  #   use_mid_weekly=true  → common_params（中观启用时用，旧默认 = tiered_mid_full 同款）
  #   use_mid_weekly=false → common_params_micro_only（Optuna v1 最优，纯微观用）
  common_params:
    # 中观启用时使用旧默认参数。原计划用 Optuna v3 (narrow_mid) 替代，但全品种回测
    # 显示 v3 平均 Sharpe=−0.358 反而劣于默认参数 (+0.096)，FU/J/AG 等强信号品种被打
    # 散；详见 docs/model_thoughts.md §9.7。决策：保留默认值作为 with-mid 生产基线。
    objective: regression
    metric: l2
    boosting_type: gbdt
    learning_rate: 0.03
    num_leaves: 63
    max_depth: 6
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    min_child_samples: 120
    reg_alpha: 0.0
    reg_lambda: 1.0
    verbosity: -1
    n_jobs: -1
    seed: 42
  common_params_micro_only:
    # Optuna v1（micro-only，39 品种 mean val Spearman IC=0.02998 @ trial 20）。
    # use_mid_weekly=false 时启用；纯微观下经全品种回测验证有效（见 model_thoughts §9.7）。
    objective: regression
    metric: l2
    boosting_type: gbdt
    learning_rate: 0.0118
    num_leaves: 62
    max_depth: 7
    feature_fraction: 0.583
    bagging_fraction: 0.563
    bagging_freq: 5
    min_child_samples: 206
    reg_alpha: 0.104
    reg_lambda: 1.66e-7
    verbosity: -1
    n_jobs: -1
    seed: 42
  low_vol_overrides: {}
  high_vol_overrides:
    min_child_samples: 150
  # min_child_samples 走 max 语义（见 modeling.py::_resolve_regime_params）：
  #   use_mid_weekly=true  → common=120, override=150 → high_vol 实际取 150（加强正则）
  #   use_mid_weekly=false → common=206, override=150 → high_vol 实际取 206（override 不生效）
  # 这保证 override 永远不降低高波域正则强度，与历史 tiered_mid_full / Optuna v1 搜索阶段一致。

signal:
  signal_col: pred_return
  threshold_mode: quantile
  entry_quantile: 0.92
  exit_quantile: 0.4
  confirmation_bars: 2
  min_hold_bars: 10           # 与 target_horizon=60 协调，避免持仓时长 << 预测视野
  cooldown_bars: 1
  allow_direct_flip: false
  flip_to_flat_first: true
  enforce_cost_filter: true  # 是否关闭cost filter 4bp、用 entry_quantile 自然控制开仓密度
  round_trip_turnover: 2.0
  cost_filter_multiple: 0.9
  min_expected_edge: 0.0
  # 策略B: 切换方式 exit_mode: target_hit + model.target_column: target_extreme_norm
  exit_mode: quantile      # quantile(当前) | target_hit(价格触达预测极值止盈)
  tp_fraction: 1.0         # 止盈目标 = tp_fraction × |pred_extreme|

backtest:
  commission_rate: 0.0001
  slippage_rate: 0.0001
  hold_to_next_bar: true
  annualization_days: 250
  flatten_at_day_end: true
  save_prediction_table: false
